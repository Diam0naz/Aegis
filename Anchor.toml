[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

# [programs.devnet]
# aegis_project = "E7gRicDGMsBxtLd93eYT9dJkHwnAQ1EfpmgBuoUFXDsw"

[programs.localnet]
aegis_project = "E7gRicDGMsBxtLd93eYT9dJkHwnAQ1EfpmgBuoUFXDsw"

[registry]
url = "https://api.apr.dev"

# [provider]
# cluster = "devnet"
# wallet = "/home/user/.config/solana/devnet-wallet.json"
[provider]
cluster = "localnet"
wallet = "/home/user/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[surfpool]
startup_wait = 10000
shutdown_wait = 2000
rpc_port = 8899
host = "127.0.0.1"

