[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
aegis_project = "FsG83myaVACEpxdy96ieCpVUAGgxVT5wq3T6nQxqPm9Y"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[surfpool]
startup_wait = 10000
shutdown_wait = 2000
rpc_port = 8899
host = "127.0.0.1"
