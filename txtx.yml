      authority_keypair_json: ~/.config/solana/id.json
  devnet:
      network_id: devnet
      rpc_api_url: https://devnet.helius-rpc.com/?api-key=40ebb625-66bc-466f-a22d-dd9201b31014
      payer_keypair_json: ~/.config/solana/id.json
      authority_keypair_json: ~/.config/solana/id.json

